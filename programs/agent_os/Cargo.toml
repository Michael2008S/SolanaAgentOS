[package]
name = "agent_os"
version = "0.1.0"
description = "AgentOS on-chain identity, policy, session, vault, escrow and reputation program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_os"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed", "allow-missing-optionals"] }
anchor-spl = { version = "1.2.0", features = ["associated_token", "token"] }
